name: Simple CI/CD Demo

on:
  pull_request: # Runs CI when someone opens a PR
  push:
    branches: [ main ] # Runs CD when PR is merged to main

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step 1: Continuous Integration (Test)
      - name: Check that index.html is not empty
        run: grep -q "[^[:space:]]" index.html   # fails if the file is empty or only whitespace

      - name: Check that index.html is valid HTML
        run: npx --yes html-validate@9.7.1 index.html

      # Step 2: Continuous Deployment (Simulate/Deploy)
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying latest main branch to live server!"
