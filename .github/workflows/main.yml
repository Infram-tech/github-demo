name: CI/CD

on:
  pull_request:          # CI: runs on every PR (including PRs from forks)
  push:
    branches: [ main ]   # CD: runs when a PR is merged into main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ---------- Continuous Integration ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html is not empty
        run: test -s index.html

      - name: index.html has a heading
        run: grep -q "<h1>" index.html

  # ---------- Continuous Deployment ----------
  deploy:
    needs: test                          # only deploy if CI passed
    if: github.event_name == 'push'      # never deploy from a PR
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
